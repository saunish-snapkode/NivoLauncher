name: Build

# Every push to main and every pull request: run the unit tests and build a debug APK you can download from the run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties asks for a JDK 25 daemon.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Installs the SDK command-line tools and accepts the licences, so AGP can fetch the compileSdk platform it needs.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -PversionName="ci-${GITHUB_SHA::7}" -PversionCode="${{ github.run_number }}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NivoLauncher-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
